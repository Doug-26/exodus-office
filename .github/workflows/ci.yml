name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Office portal (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: office-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: office-portal/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx ng test --watch=false

  api:
    name: Employee API (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/employee.api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore employee.api.slnx
      - run: dotnet build employee.api.slnx --no-restore --configuration Release
      - run: dotnet test employee.api.slnx --no-build --configuration Release
